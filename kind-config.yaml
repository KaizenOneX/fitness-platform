# kind cluster for local development.
#
# Commit to fitness-platform/kind-config.yaml
#
#   kind create cluster --name fitness-dev --config kind-config.yaml
#
# The extraPortMappings and the ingress-ready label are here from week 1 on
# purpose: ingress-nginx needs both, and adding them later means destroying
# and recreating the cluster. Cheap to include now, annoying to retrofit.
#
# Two worker nodes rather than one, so that scheduling is a real thing from
# the start — you can cordon a node, watch pods move, and see nodeSelector
# and affinity rules actually take effect. Costs about 400MB of RAM.

kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: fitness-dev

nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      # ingress-nginx HTTP  -> localhost:80
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      # ingress-nginx HTTPS -> localhost:443
      - containerPort: 443
        hostPort: 443
        protocol: TCP

  - role: worker
  - role: worker

# Everything resolves through *.localhost by default in week 4.
# If you would rather use a real hostname, add to /etc/hosts:
#   127.0.0.1  fitness.local api.fitness.local
